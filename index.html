<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records">
          <span class="label">RÉCORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <b id="best-combo">0</b></span>
            <span>Líneas máx.: <b id="best-lines">0</b></span>
          </div>
          <button id="reset-records-btn" type="button">Resetear récords</button>
        </div>

        <div class="panel-section theme-toggle">
          <span class="label">THEME</span>
          <label class="switch">
            <input type="checkbox" id="theme-switch" aria-label="Cambiar entre tema claro y oscuro" />
            <span class="slider"></span>
          </label>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden">
          <p class="name-form__msg">¡Nuevo récord! Escribe tu nombre:</p>
          <input id="name-input" type="text" maxlength="12" placeholder="Jugador" autocomplete="off" />
          <button type="submit">Guardar</button>
        </form>

        <div id="overlay-records" class="overlay-records hidden">
          <span class="label">TOP 5</span>
          <ol id="overlay-records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <b id="overlay-best-combo">0</b></span>
            <span>Líneas máx.: <b id="overlay-best-lines">0</b></span>
          </div>
        </div>

        <button id="resume-btn" class="hidden">Reanudar</button>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
